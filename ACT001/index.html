<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TeumeBox</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body data-bs-theme="dark">
  <header class="site-header">
    <a class="brand" href="#">
      <img src="assets/teume-logo.png" alt="Teume logo">
      <span class="brand-title">TEUME<span class="brand-muted">BOX</span></span>
    </a>
    <nav class="social-links" aria-label="Social media links">
      <a href="#">Official Website</a>
      <a href="#">Weverse Shop</a>
      <a href="#">Socials</a>
    </nav>
  </header>

  <main class="container-fluid px-3 pb-3 bento-layout">
    <div class="row g-3">
      <div class="col-12 col-md-4">
        <div class="card h-100"></div>
      </div>
      <div class="col-12 col-md-8">
        <div class="row g-3">
          <div class="col-12">
            <div class="card"></div>
          </div>
          <div class="col-12 col-md-6">
            <div class="card mainteume-card">
              <img src="assets/mainteume-pic.png" alt="TREASURE">
            </div>
          </div>
          <div class="col-12 col-md-6">
            <div class="card"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="row g-3 mt-0">
      <div class="col-12 col-md-8">
        <div class="card p-1"></div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card p-1"></div>
      </div>
    </div>
  </main>
</body>

</html>
